<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Water Levels Tutorial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #e0f7fa 0%, #b3e5fc 100%);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
            gap: 12px;
        }

        .app-header {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #006064;
            background: linear-gradient(90deg, #00acc1 0%, #0097a7 100%);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 96, 100, 0.2);
            color: white;
            letter-spacing: 1px;
        }

        .app-main {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }

        .scene-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(0, 96, 100, 0.15);
        }

        .scene-title {
            font-weight: 700;
            font-size: 20px;
            color: #00838f;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 3px solid #00acc1;
        }

        .scene-description {
            font-size: 15px;
            line-height: 1.6;
            color: #455a64;
            margin-bottom: 16px;
        }

        .scene-iframe-wrapper {
            flex: 1;
            border-radius: 8px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2f1 100%);
            border: 2px solid #80deea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #00838f;
            font-weight: 600;
            box-shadow: inset 0 2px 8px rgba(0, 131, 143, 0.1);
            max-width: 993px;
        }

        .scene-iframe {
            width:100%; 
            height:100%; 
            border:none;
            border-radius: 8px;
            overflow: hidden;
        }

        .directory-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(0, 96, 100, 0.15);
        }

        .directory-title {
            font-weight: 700;
            font-size: 18px;
            text-align: center;
            color: #00838f;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 3px solid #00acc1;
        }

        .directory-list {
            list-style: none;
            font-size: 15px;
        }

        .directory-list li {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .directory-list li:hover {
            background-color: #e0f7fa;
            transform: translateX(4px);
        }

        .directory-current {
            color: #006064;
            font-weight: 700;
            background-color: #b2ebf2;
            border-left: 4px solid #00838f;
        }

        .directory-active {
            color: #f57c00;
            font-weight: 600;
            background-color: #fff3e0;
            border-left: 4px solid #ff9800;
        }

        .app-footer {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-button {
            border: none;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-button.clickable {
            color: white;
            background: linear-gradient(135deg, #00acc1 0%, #00838f 100%);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
        }

        .nav-button.clickable:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 131, 143, 0.4);
        }

        .nav-button.clickable:active {
            transform: translateY(0);
        }

        .nav-button.not-clickable {
            color: #9e9e9e;
            background: #e0e0e0;
            box-shadow: none;
            user-select: none;
        }

        .progress-bar-container {
            flex: 1;
            border-radius: 20px;
            height: 36px;
            background-color: #e0f2f1;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0, 96, 100, 0.1);
            border: 2px solid #80deea;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00acc1 0%, #0097a7 50%, #00838f 100%);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(0, 172, 193, 0.5);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">Tampa Bay Rising Sea Levels Interactive Tutorial</header>

        <main class="app-main">
            <section class="scene-panel">
                <div class="scene-title" id="scene-title"></div>
                <p class="scene-description" id="scene-description">

                </p>
                <div class="scene-iframe-wrapper">
                    <!-- All IFRAME Elements (They're Preloaded into the DOM) -->
                    <iframe id="scene-0-iframe" src="scene0.html" class="scene-iframe" style="display: none"></iframe>
                </div>
            </section>

            <aside class="directory-panel">
                <div class="directory-title">Directory</div>
                <ul class="directory-list" id="directory-list">

                </ul>
            </aside>
        </main>

        <footer class="app-footer">
            <div class="nav-button not-clickable">Back</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="nav-button clickable">Next</div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="../compiled_js/scene_manager.js"></script>
    <script src="../compiled_js/ui_manager.js"></script>
    <script src="../compiled_js/manager.js"></script>
</body>
</html>
