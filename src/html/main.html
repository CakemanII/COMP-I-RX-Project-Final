<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Water Levels Tutorial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #e0f7fa 0%, #b3e5fc 100%);
            font-size: clamp(14px, 1vw + 10px, 16px);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
            gap: 12px;
        }

        .app-header {
            text-align: center;
            font-size: clamp(22px, 2vw + 16px, 32px);
            font-weight: 700;
            color: #006064;
            background: linear-gradient(90deg, #00acc1 0%, #0097a7 100%);
            padding: clamp(12px, 1vw + 10px, 18px);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 96, 100, 0.2);
            color: white;
            letter-spacing: 1px;
        }

        .app-main {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: clamp(10px, 1vw + 8px, 16px);
            flex: 1;
            min-height: 0;
        }

        .scene-panel {
            background: white;
            border-radius: 12px;
            padding: clamp(14px, 1vw + 12px, 20px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(0, 96, 100, 0.15);
        }

        .scene-title {
            font-weight: 700;
            font-size: clamp(16px, 1vw + 14px, 20px);
            color: #00838f;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 3px solid #00acc1;
        }

        .scene-description {
            font-size: clamp(13px, 0.6vw + 12px, 15px);
            line-height: 1.6;
            color: #455a64;
            margin-bottom: 16px;
        }

        .scene-outer-iframe-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Inner wrapper at native size; we scale it via JS so the entire iframe content (including buttons) scales. */
        .scene-inner-iframe-wrapper {
            position: absolute;
            width: 993px;
            height: 558px;
            left: 50%;
            top: 50%;
            border-radius: clamp(6px, 1vw + 4px, 8px);
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2f1 100%);
            border: 2px solid #80deea;
            box-shadow: inset 0 2px 8px rgba(0, 131, 143, 0.1);
            overflow: hidden;
            transform-origin: center center;
            transition: all 0.2s ease;
        }

        .scene-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
            transform-origin: center center;
        }

        .directory-panel {
            background: white;
            border-radius: 12px;
            padding: clamp(14px, 1vw + 12px, 20px);
            width: 280px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(0, 96, 100, 0.15);
        }

        .directory-title {
            font-weight: 700;
            font-size: clamp(15px, 1vw + 12px, 18px);
            text-align: center;
            color: #00838f;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 3px solid #00acc1;
        }

        .directory-list {
            list-style: none;
            font-size: clamp(13px, 0.6vw + 12px, 15px);
        }

        .directory-list li {
            margin-bottom: 12px;
            padding: clamp(8px, 0.6vw + 6px, 10px) clamp(10px, 0.8vw + 8px, 12px);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .directory-list li:hover {
            background-color: #e0f7fa;
            transform: translateX(4px);
        }

        .directory-current {
            color: #006064;
            font-weight: 700;
            background-color: #b2ebf2;
            border-left: 4px solid #00838f;
        }

        .directory-active {
            color: #f57c00;
            font-weight: 600;
            background-color: #fff3e0;
            border-left: 4px solid #ff9800;
        }

        .app-footer {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-button {
            border: none;
            padding: clamp(10px, 1vw + 8px, 14px) clamp(22px, 2vw + 16px, 28px);
            font-weight: 700;
            font-size: clamp(14px, 0.8vw + 12px, 16px);
            border-radius: clamp(6px, 0.8vw + 4px, 8px);
            transition: all 0.3s ease;
        }

        .nav-button.clickable {
            color: white;
            background: linear-gradient(135deg, #00acc1 0%, #00838f 100%);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
        }

        .nav-button.clickable:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 131, 143, 0.4);
        }

        .nav-button.clickable:active {
            transform: translateY(0);
        }

        .nav-button.not-clickable {
            color: #9e9e9e;
            background: #e0e0e0;
            box-shadow: none;
            user-select: none;
        }

        .progress-bar-container {
            flex: 1;
            border-radius: 20px;
            height: clamp(28px, 1vw + 24px, 36px);
            background-color: #e0f2f1;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0, 96, 100, 0.1);
            border: 2px solid #80deea;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00acc1 0%, #0097a7 50%, #00838f 100%);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(0, 172, 193, 0.5);
        }

        @media (max-width: 900px) {
            .app-main {
                grid-template-columns: 1fr;
            }

            .directory-panel {
                width: 100%;
            }
        }

        /* Audio Permission Overlay */
        #audio-permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .audio-prompt-box {
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
            border: 3px solid #00acc1;
            border-radius: 16px;
            padding: 30px 40px;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .audio-prompt-box h2 {
            color: #00838f;
            margin: 0 0 16px 0;
            font-size: clamp(20px, 2vw + 16px, 24px);
        }

        .audio-prompt-box p {
            color: #006064;
            margin: 0 0 24px 0;
            line-height: 1.6;
            font-size: clamp(14px, 1vw + 12px, 16px);
        }

        .audio-enable-btn {
            background: linear-gradient(135deg, #00acc1 0%, #0097a7 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: clamp(14px, 0.8vw + 12px, 16px);
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 131, 143, 0.3);
            transition: all 0.3s ease;
        }

        .audio-enable-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 131, 143, 0.4);
        }

        .audio-enable-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- Audio Permission Overlay -->
    <div id="audio-permission-overlay">
        <div class="audio-prompt-box">
            <h2>Enable Audio Narration?</h2>
            <p>This tutorial includes audio narration to enhance your learning experience.</p>
            <button id="enable-audio-btn" class="audio-enable-btn">Enable Audio</button>
        </div>
    </div>

    <div class="app-container">
        <header class="app-header">Tampa Bay Rising Sea Levels Interactive Tutorial</header>

        <main class="app-main">
            <section class="scene-panel">
                <div class="scene-title" id="scene-title"></div>
                <p class="scene-description" id="scene-description">

                </p>
                <div class="scene-outer-iframe-wrapper">
                    <div class="scene-inner-iframe-wrapper">
                        <!-- All IFRAME Elements (They're Preloaded into the DOM) -->
                        <iframe id="scene-0-iframe" src="scene0.html" class="scene-iframe" style="display: none"></iframe>
                    </div>
                </div>
            </section>

            <aside class="directory-panel">
                <div class="directory-title">Directory</div>
                <ul class="directory-list" id="directory-list">

                </ul>
            </aside>
        </main>

        <footer class="app-footer">
            <div class="nav-button not-clickable">Back</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="nav-button clickable">Next</div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="../compiled_js/scene_manager.js"></script>
    <script src="../compiled_js/ui_manager.js"></script>
    <script src="../compiled_js/manager.js"></script>
    
    <script>
        // Scale the inner wrapper (and all iframe contents) using transform for smooth, dynamic resizing.
        function scaleIframeWrapper() {
            const outer = document.querySelector('.scene-outer-iframe-wrapper');
            const inner = document.querySelector('.scene-inner-iframe-wrapper');
            if (!outer || !inner) return;

            const outerRect = outer.getBoundingClientRect();
            const baseWidth = 993;
            const baseHeight = 558;

            const scaleX = outerRect.width / baseWidth;
            const scaleY = outerRect.height / baseHeight;
            const scale = Math.min(scaleX, scaleY);

            inner.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        window.addEventListener('load', scaleIframeWrapper);
        window.addEventListener('resize', scaleIframeWrapper);
        setTimeout(scaleIframeWrapper, 50);

        // Handle audio permission button click
        document.getElementById('enable-audio-btn').addEventListener('click', () => {
            // Hide the overlay
            UIManager.INSTANCE.hideAudioPermissionPrompt();
            // Send message to iframe to retry playing audio
            window.postMessage({ type: 'PLAY_AUDIO' }, '*');
        });
    </script>
</body>
</html>
