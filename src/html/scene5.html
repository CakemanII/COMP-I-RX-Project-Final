<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Water Levels Tutorial</title>
    <link rel="stylesheet" href="../css/scene_styles.css">
</head>
<body>
    <div class="scene-container">
        <img src="../media/scene5/sc_5_bg.jpg" alt="">
        
        <!-- Circular Buttons -->
        <div id="button-1" class="circular-button pulse" style="top: 180px; left: 350px;">+</div>
        <div id="button-2" class="circular-button pulse" style="top: 120px; left: 806px;">+</div>
        <div id="button-3" class="circular-button pulse" style="top: 400px; left: 490px;">+</div>

        <!-- Info Box for Button 1 -->
        <div id="info-box-1" class="info-box" style="top: 180px; left: 75px;">
            <h3>Animal Wildlife</h3>
            <p>[Info]</p>
        </div>
        <div id="info-box-2" class="info-box" style="top: 70px; left: 460px;">
            <h3>Information Point 2</h3>
            <p>This is detailed information about this location. Click the button again to close this box.</p>
        </div>
        <div id="info-box-3" class="info-box" style="top: 400px; left: 210px;">
            <h3>Plants and Vegitation</h3>
            <p>[info]</p>
        </div>
    </div>

    <audio id="initial-narration" src="../media/demo_audio_test.mp3" paused></audio>
    <audio id="info-1-narration" src="../media/demo_audio_test.mp3" paused></audio>
    <audio id="info-2-narration" src="../media/demo_audio_test.mp3" paused></audio>
    <audio id="info-3-narration" src="../media/demo_audio_test.mp3" paused></audio>
    <audio id="info-4-narration" src="../media/demo_audio_test.mp3" paused></audio>
    
    <!-- Scripts -->
     <script src="../compiled_js/scene.js"></script>
     <script src="../compiled_js/scene5.js"></script>
