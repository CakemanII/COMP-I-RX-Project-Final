<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Water Levels Tutorial</title>
    <link rel="stylesheet" href="../css/scene_styles.css">
</head>
<body>
    <div class="scene-container">
        <img src="../media/scene_3/sc_3_bg.png" alt="">
        
        <!-- Circular Buttons -->
        <div id="button-1" class="circular-button pulse" style="top: 320px; left: 180px;">+</div>
        <div id="button-2" class="circular-button pulse" style="top: 350px; left: 746px;">+</div>
        <div id="button-3" class="circular-button pulse" style="top: 130px; left: 479px;">+</div>

        <div id="info-box-1" class="info-box" style="top: 270px; left: 370px;">

        </div>

    <audio id="initial-narration" src="../media/demo_audio_test.mp3" paused></audio>
